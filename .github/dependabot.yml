# AlphaLatitude Inc. © 2026
#
# Dependabot keeps dependencies current and opens PRs for security advisories.
# Grouped weekly so updates arrive as a small number of reviewable PRs rather
# than one per package.
version: 2
updates:
  # GitHub Actions used by the workflows (also moves Scorecard Pinned-Dependencies).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Root npm project (the MCP stdio server + its test/build tooling).
  # Note: committing any change to this file makes Dependabot run an immediate
  # check for all ecosystems — the no-button way to re-run after a config or
  # override fix (used 2026-08-24 to confirm the $esbuild override unblocked
  # the npm job).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-root:
        patterns: ["*"]
    # Hold two majors the repo is not ready for (minor/patch + security still
    # flow). Drop the ignore when the blocker below is resolved.
    ignore:
      # vitest 4's rolldown engine fails to start here; suite stays on v3.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 errors on the baseUrl tsconfig option this repo uses
      # (TS5101); held at v5 until tsconfig is migrated.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The proxy Worker's local tooling (wrangler and its transitive deps).
  - package-ecosystem: npm
    directory: "/worker-proxy"
    schedule:
      interval: weekly
    groups:
      worker-proxy:
        patterns: ["*"]
    ignore:
      # wrangler 4 requires Node 22; CI and the proxy deploy run on Node 20.
      # The vulns it would clear are already handled via npm overrides (#102).
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-major"]

  # The four published Python packages (PEP 621 pyproject dependencies).
  - package-ecosystem: pip
    directory: "/integrations/python/optionsahoy"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/integrations/python/optionsahoy-langchain"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/integrations/python/llama-index-tools-optionsahoy"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/integrations/python/crewai-optionsahoy"
    schedule:
      interval: weekly
