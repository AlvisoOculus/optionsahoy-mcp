# Publish optionsahoy-mcp to the public npm registry WITH provenance.
#
# Provenance (SLSA build attestation) ties the published tarball to this exact
# repo + commit + workflow run, verifiable via `npm audit signatures` and shown
# as a "Provenance" badge on the npm package page. It requires:
#   - a PUBLIC GitHub repo (this one is), and
#   - `id-token: write` (OIDC) below.
#
# ONE-TIME SETUP (repo owner):
#   1. Create an npm "Automation" access token at npmjs.com (Account → Access
#      Tokens → Generate → Automation).
#   2. Add it as the repo secret `NPM_TOKEN`
#      (Settings → Secrets and variables → Actions → New repository secret).
#   The same NPM_TOKEN publishes both packages below (both unscoped, same owner).
#
# TWO packages ship from here on a Release:
#   - the root `optionsahoy-mcp` (stdio server) at package.json version, and
#   - `optionsahoy-ai-sdk` (Vercel AI SDK adapter) at
#     integrations/js/optionsahoy-ai-sdk/package.json version.
#
# TO PUBLISH: cut a GitHub Release (tag e.g. v1.9.0). Bump the version of each
# package you intend to ship first — npm rejects republishing an existing
# version, so an unchanged package's job goes red (harmless, but bump to ship).
# `prepublishOnly` runs a build before each publish.
#
# Or dispatch this workflow with `tag: v1.9.0` and it cuts that release
# itself, then does everything a `release: published` run would. See the
# create-release job for why that entry point has to exist.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cut this GitHub release first, then publish it (e.g. v1.10.2). Blank = only republish the current commit to npm.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  # The GitHub release is the trigger for everything else here: the .mcpb
  # asset attaches to it, and the registry republish that keeps
  # optionsahoy-mcp current in every MCP index is gated on it. The monthly
  # release routine can do every step except this one — its sandbox has no
  # `gh` CLI, api.github.com is blocked by the egress proxy, and the GitHub
  # MCP server exposes no create-release tool — so on 2026-09-01 it merged
  # the 1.10.2 bump, asked for the release by push notification, and the
  # registry sat on 1.10.1 until someone read the notification. Dispatching a
  # workflow it CAN do, so the step it cannot reach lives here.
  #
  # Everything runs in this one workflow run on purpose: a release created
  # with GITHUB_TOKEN does not fire `release: published`, so handing off to a
  # second workflow would hand off to something that never wakes up.
  create-release:
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::$TAG does not match package.json ($version) — bump the version first, or dispatch the matching tag."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to cut."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit
      # Skip-existing: an unchanged package whose version is already on the
      # registry is a no-op, not a hard failure - so a release (or a re-run)
      # that did not bump this package does not red-X. Mirrors the PyPI
      # skip-existing behavior in publish-python.yml.
      - name: Publish to npm (skip if version already published)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Fail-safe skip-existing: only publish when npm POSITIVELY reports the
          # version missing (E404). A transient registry error must not be read
          # as "not published" and trigger a publish that then 403s on a re-run;
          # surface it instead so a human decides.
          if npm view "$name@$version" version >/dev/null 2>view-err.txt; then
            echo "$name@$version already on npm; skipping publish (no-op)."
          elif grep -q 'E404' view-err.txt; then
            npm publish --provenance --access public
          else
            echo "npm view failed for a non-404 reason; not publishing:"; cat view-err.txt; exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The Vercel AI SDK adapter package (integrations/js/optionsahoy-ai-sdk).
  # Self-contained: its own deps, build (tsc -> dist/), and tests. Provenance
  # via the same OIDC + NPM_TOKEN as the root package.
  publish-ai-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/js/optionsahoy-ai-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit
      - run: npm test # conformance + tool-shape tests gate the publish
      # Skip-existing (see the root publish job): the adapter carries its own
      # version, independent of the release tag; an unchanged version already
      # on npm is a no-op, not a 403 that fails the release.
      - name: Publish adapter to npm (skip if version already published)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Fail-safe skip-existing: only publish when npm POSITIVELY reports the
          # version missing (E404). A transient registry error must not be read
          # as "not published" and trigger a publish that then 403s on a re-run;
          # surface it instead so a human decides.
          if npm view "$name@$version" version >/dev/null 2>view-err.txt; then
            echo "$name@$version already on npm; skipping publish (no-op)."
          elif grep -q 'E404' view-err.txt; then
            npm publish --provenance --access public
          else
            echo "npm view failed for a non-404 reason; not publishing:"; cat view-err.txt; exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Claude Desktop extension: pack the stdio bundle as optionsahoy.mcpb and
  # attach it to the release so docs can link the stable URL
  # releases/latest/download/optionsahoy.mcpb.
  mcpb:
    needs: create-release
    # create-release is SKIPPED on the `release: published` path, and a
    # skipped dependency would skip this job too under the default success()
    # gate. !failure() keeps it running there while still refusing to attach
    # an asset to a release that failed to cut.
    if: ${{ !cancelled() && !failure() && (github.event_name == 'release' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release asset
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install --no-audit
      - run: npm run build:mcpb
      - run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" optionsahoy.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Official MCP registry (registry.modelcontextprotocol.io): republish
  # server.json so the io.github.AlvisoOculus/optionsahoy-mcp entry tracks
  # the released version. Auth is GitHub OIDC (no secrets) - the registry
  # grants io.github.<owner>/* to workflows running in that owner's repos.
  registry:
    needs: create-release
    # Same gate as mcpb: skipped-not-failed on the release path.
    if: ${{ !cancelled() && !failure() && (github.event_name == 'release' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
