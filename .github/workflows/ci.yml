name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default token: the workflow's GITHUB_TOKEN is read-only.
# Jobs that need more (e.g. id-token: write) grant it at the job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
