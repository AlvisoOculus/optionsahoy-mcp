name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default token: the workflow's GITHUB_TOKEN is read-only.
# Jobs that need more (e.g. id-token: write) grant it at the job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The AI SDK adapter keeps its own zod copies of the request schemas, and
      # its conformance test used to run only at publish time: #274 added
      # itemizedTaxes, merged green, and the 1.11.0 release run went red.
      - name: AI SDK adapter tests (schema conformance with openapi.json)
        working-directory: integrations/js/optionsahoy-ai-sdk
        run: |
          npm install --no-audit --no-fund
          npm test
