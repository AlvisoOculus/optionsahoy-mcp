# Daily drift check: the official MCP registry's latest published version must
# match package.json. The drift class this guards: a version reaching
# package.json without its release, so npm-publish.yml's release-gated
# registry job never runs and the registry stays pinned to a stale version
# (2026-08: npm 1.10.1, registry 1.9.8 for two weeks; 2026-10-01: the 1.10.3
# bump merged unreleased). A merged bump now releases itself, so a red run
# here means that npm-publish run failed or never fired. Fix: dispatch
# npm-publish.yml with tag v<package.json version>.

name: Registry freshness

permissions:
  contents: read

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare registry isLatest to package.json
        run: |
          set -euo pipefail
          local_version=$(node -p "require('./package.json').version")
          registry_version=$(curl -sSf "https://registry.modelcontextprotocol.io/v0/servers?search=optionsahoy" \
            | node -e "
              let s = '';
              process.stdin.on('data', (c) => (s += c));
              process.stdin.on('end', () => {
                const d = JSON.parse(s);
                const latest = (d.servers || []).find(
                  (x) => x._meta?.['io.modelcontextprotocol.registry/official']?.isLatest,
                );
                if (!latest) { console.error('no isLatest entry found'); process.exit(1); }
                console.log(latest.server.version);
              });
            ")
          echo "package.json: $local_version | registry isLatest: $registry_version"
          if [ "$local_version" != "$registry_version" ]; then
            echo "::error::Registry drift: registry.modelcontextprotocol.io serves $registry_version but package.json is $local_version. Check the npm-publish.yml run for the bump, or dispatch it with tag=v$local_version to cut the release and republish."
            exit 1
          fi
