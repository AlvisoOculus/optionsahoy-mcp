[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-optionsahoy"
version = "0.1.3"
description = "CrewAI tools for the OptionsAhoy equity-compensation calculators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlphaLatitude Inc." }]
keywords = ["crewai", "tools", "equity-compensation", "iso", "amt", "nso", "rsu", "qsbs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "optionsahoy>=0.1.0",
    "crewai-tools>=0.12",
]

[project.urls]
Homepage = "https://optionsahoy.com"
Repository = "https://github.com/AlvisoOculus/optionsahoy-mcp"
Documentation = "https://optionsahoy.com/for-agents"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["crewai_optionsahoy"]

[tool.ruff]
line-length = 100

# Published metadata depends on `optionsahoy` by version (see [project] dependencies).
# For local development, install the sibling package editable first so the version
# dependency resolves to your working tree instead of PyPI:
#   pip install -e integrations/python/optionsahoy
#   pip install -e integrations/python/crewai-optionsahoy
