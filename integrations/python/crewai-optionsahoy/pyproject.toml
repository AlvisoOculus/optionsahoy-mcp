[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-optionsahoy"
version = "0.1.0"
description = "CrewAI tools for the OptionsAhoy equity-compensation calculators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlphaLatitude Inc." }]
keywords = ["crewai", "tools", "equity-compensation", "iso", "amt", "nso", "rsu", "qsbs"]
dependencies = [
    "optionsahoy>=0.1.0",
    "crewai-tools>=0.12",
]

[project.urls]
Homepage = "https://optionsahoy.com"
Documentation = "https://optionsahoy.com/for-agents"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["crewai_optionsahoy"]

[tool.ruff]
line-length = 100

# During local development the `optionsahoy` dependency is resolved from the
# sibling path. Install both editable from the repo:
#   pip install -e integrations/python/optionsahoy
#   pip install -e integrations/python/crewai-optionsahoy
