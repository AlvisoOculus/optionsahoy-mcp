[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optionsahoy-eval"
version = "0.1.0"
description = "An inspect_ai evaluation measuring whether agents reach the provable optimum on equity-compensation tax-optimization tasks, with and without the OptionsAhoy tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlphaLatitude Inc." }]
keywords = [
    "inspect-ai",
    "eval",
    "agent",
    "tool-use",
    "equity-compensation",
    "iso",
    "amt",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "inspect-ai>=0.3.50",
    "optionsahoy>=0.1.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://optionsahoy.com"
Repository = "https://github.com/AlvisoOculus/optionsahoy-mcp"
Documentation = "https://optionsahoy.com/for-agents"
"Verification" = "https://optionsahoy.com/verification"
"Companion benchmark" = "https://github.com/AlvisoOculus/llm-iso-benchmark"

[tool.hatch.build.targets.wheel]
packages = ["optionsahoy_eval"]

[tool.hatch.build]
include = ["optionsahoy_eval/scenarios.json", "optionsahoy_eval/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real OptionsAhoy API (skipped unless OA_LIVE=1 is set).",
]

[tool.ruff]
line-length = 100
